[project]
name = "crud-cross"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.33.1",
    "pandas>=3.0.2",
    "pandera[pandas]>=0.31.1",
    "streamlit>=1.57.0",
    "pydantic>=2.13.4",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.49",
    "alembic>=1.18.4",
    "fastapi[standard]>=0.136.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing"

[tool.coverage.run]
omit = [".venv/*", "alembic/*", "test*.py"]

[tool.coverage.report]
show_missing = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
